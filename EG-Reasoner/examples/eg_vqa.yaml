data:
  train_files: ../data/train_set_parquet
  val_files: null
  prompt_key: problem
  answer_key: answer
  image_key: images
  max_prompt_length: 7000
  max_response_length: 1024
  rollout_batch_size: 16
  val_batch_size: -1
  shuffle: true
  seed: 1
  max_pixels: 100352
  min_pixels: 75264
  format_prompt: |
    You are a video understanding assistant. Given a video and a question, respond with exactly three sections in this order: <evidence>, <think>, <answer>.

    Format:
    <evidence>
    Time:MM:SS-MM:SS, Des: ...
    </evidence>

    <think>
    reasoning based only on the evidence
    </think>

    <answer>
    concise direct answer
    </answer>

    IMPORTANT RULES:
    - Evidence must list relevant video segments in chronological order
    - Use at most 5 evidence lines
    - Each evidence line must follow: Time:MM:SS-MM:SS, Des: ...
    - Do not repeat descriptions or time segments
    - Think must be 2-4 sentences based only on the evidence
    - Answer must be 1 short sentence with no explanation
    - Do not output any extra text

    Question: {question}


algorithm:
  adv_estimator: grpo
  disable_kl: false
  use_kl_loss: true
  kl_penalty: low_var_kl
  kl_coef: 1.0e-2

worker:
  actor:
    global_batch_size: 16
    micro_batch_size_per_device_for_update: 1
    micro_batch_size_per_device_for_experience: 4
    max_grad_norm: 1.0
    padding_free: true
    ulysses_sequence_parallel_size: 1
    model:
      model_path: Qwen/Qwen2.5-VL-7B-Instruct
      enable_gradient_checkpointing: true
      trust_remote_code: false
      freeze_vision_tower: false
    optim:
      lr: 1.0e-6
      weight_decay: 1.0e-2
      strategy: adamw  # {adamw, adamw_bf16}
      lr_warmup_ratio: 0.0
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: false
      enable_rank0_init: true
      # torch_dtype: bf16
    offload:
      offload_params: true  # true: more CPU memory; false: more GPU memory
      offload_optimizer: true  # true: more CPU memory; false: more GPU memory

  rollout:
    n: 8
    temperature: 1.0
    top_p: 0.99
    gpu_memory_utilization: 0.6
    enforce_eager: false
    enable_chunked_prefill: false
    tensor_parallel_size: 2
    limit_images: 0
    val_override_config:
      temperature: 0.5
      n: 1
    max_num_batched_tokens: 32768

  ref:
    fsdp:
      enable_full_shard: true
      enable_cpu_offload: true  # true: more CPU memory; false: more GPU memory
      enable_rank0_init: true
    offload:
      offload_params: false

  reward:
    reward_type: function
    score_function: ./examples/score_function/eg_vqa_reward.py:compute_score
    score_function_kwargs:
      format_weight: 0.1
      evidence_weight: 0.3
      accuracy_weight: 0.6
      iou_threshold: 0.3
      sim_threshold: 0.5
      semantic_model_dir: ./Science_Bert
      semantic_device: cuda

trainer:
  total_episodes: 1
  logger: ["console", "wandb"]
  project_name: EG-VQA
  experiment_name: EG-Reasoner
  n_gpus_per_node: 4
  nnodes: 1
  val_freq: -1  # -1 to disable
  val_before_train: false
  val_only: false
  val_generations_to_log: 3
  save_freq: 20  # -1 to disable
  save_limit: 1  # -1 to disable
  save_checkpoint_path: null
  load_checkpoint_path: null
